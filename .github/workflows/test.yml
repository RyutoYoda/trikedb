name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor and the ceiling: requires-python is >=3.10, and a new
        # release breaking on the newest interpreter is the report that
        # arrives after someone has already given up on installing it.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  local-file-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/test_review_regressions.py -q -k "local_writers or simultaneous_local or failed_reload or rest_reads_after or mcp_reads_and_writes_after"

  # The graph page is generated, committed and served from docs/. Nothing
  # else notices when it drifts from the graph it was built from.
  docs-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "."
      - run: |
          python -m trikedb.cli check examples/graphs/trike/trike_workspace.yaml --html docs/index.html
          python -m trikedb.cli check examples/graphs/acme/acme_pipeline.yaml --html docs/pipeline.html
          python -m trikedb.cli check examples/graphs/freebase/freebase_workspace.yaml --html docs/workspace.html

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py

  docker-editor-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f examples/review_app/compose.yaml build
      - run: docker compose -f examples/review_app/compose.yaml up -d
      - run: docker compose -f examples/review_app/compose.yaml exec -T review python -m unittest examples.review_app.test_review_app -q
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8765/api/meta
      - if: always()
        run: docker compose -f examples/review_app/compose.yaml down -v
