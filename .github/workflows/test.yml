name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  r2rml-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Download pinned W3C R2RML suite
        run: |
          curl -fsSL --retry 3 -o /tmp/rdb2rdf-ts.zip https://dvcs.w3.org/hg/rdb2rdf-tests/raw-file/default/rdb2rdf-ts.zip
          echo '128270b483042fd7612e10c071c3b81eb44c1c534f341ec6d5c2286675781f71  /tmp/rdb2rdf-ts.zip' | sha256sum -c -
          mkdir -p /tmp/rdb2rdf-ts
          unzip -q /tmp/rdb2rdf-ts.zip -d /tmp/rdb2rdf-ts
      - name: Run official R2RML cases
        env:
          TRIKEDB_W3C_R2RML_SUITE: /tmp/rdb2rdf-ts
        run: uv run --extra dev python -m pytest -q tests/test_r2rml_w3c.py
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor and the ceiling: requires-python is >=3.10, and a new
        # release breaking on the newest interpreter is the report that
        # arrives after someone has already given up on installing it.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  local-file-safety:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/test_review_regressions.py -q -k "local_writers or simultaneous_local or failed_reload or rest_reads_after or mcp_reads_and_writes_after"

  # The graph page is generated, committed and served from docs/. Nothing
  # else notices when it drifts from the graph it was built from.
  docs-are-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "."
      - run: |
          python -m trikedb.cli check examples/graphs/trike/trike_workspace.yaml --html docs/index.html
          python -m trikedb.cli check examples/graphs/acme/acme_pipeline.yaml --html docs/pipeline.html
          python -m trikedb.cli check examples/graphs/freebase/freebase_workspace.yaml --html docs/workspace.html

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py

  docker-editor-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: docker compose -f examples/review_app/compose.yaml build
      - run: docker compose -f examples/review_app/compose.yaml up -d
      - run: docker compose -f examples/review_app/compose.yaml exec -T review python -m unittest examples.review_app.test_review_app -q
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8765/api/meta
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python examples/review_app/browser_smoke.py
      - if: always()
        run: docker compose -f examples/review_app/compose.yaml down -v

  worker-editor-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/review_app/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/review_app/cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run deploy -- --dry-run
