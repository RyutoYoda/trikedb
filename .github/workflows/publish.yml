name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already merged into main (for example, 0.48.0)
        required: false
        type: string
      verify_only:
        description: Verify PyPI Trusted Publisher without uploading a package
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  REQUESTED_VERSION: ${{ inputs.version }}

jobs:
  verify-publisher:
    if: inputs.verify_only
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Verify PyPI accepts this workflow identity
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=pypi"
          request = Request(
              request_url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urlopen(request, timeout=20) as response:
              oidc_token = json.load(response)["value"]
          request = Request(
              "https://pypi.org/_/oidc/mint-token",
              data=json.dumps({"token": oidc_token}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urlopen(request, timeout=20) as response:
              assert json.load(response).get("token"), "PyPI did not issue a token"
          print("PyPI accepted the Trusted Publisher identity; no package was uploaded.")
          PY

  build:
    if: ${{ !inputs.verify_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Check requested version
        run: |
          test -n "$REQUESTED_VERSION"
          test "$(git describe --tags --exact-match)" = "v$REQUESTED_VERSION"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(uv version --short)" = "$REQUESTED_VERSION"
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl python -c 'import os, trikedb; assert trikedb.__version__ == os.environ["REQUESTED_VERSION"]'
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz python -c 'import os, trikedb; assert trikedb.__version__ == os.environ["REQUESTED_VERSION"]'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attest distributions for PyPI
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7
      - name: Publish distributions
        run: uv publish --trusted-publishing always
      - uses: actions/upload-artifact@v4
        with:
          name: attested-dist
          path: dist/
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: attested-dist
          path: dist/
      - name: Publish GitHub release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
          gh release create "v$REQUESTED_VERSION" dist/* \
            --verify-tag --generate-notes --title "TrikeDB v$REQUESTED_VERSION"
