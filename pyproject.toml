[build-system]
requires = ["setuptools>=77"]   # SPDX の license 表記に必要
build-backend = "setuptools.build_meta"

[project]
name = "trikedb"
version = "0.42.1"
description = "The single-file graph database: a knowledge graph that lives in one YAML file, queried with SPARQL 1.1. Built for LLM agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryuto Yoda" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "rdflib>=7", "pyoxigraph>=0.4"]
keywords = ["knowledge-graph", "rdf", "triple-store", "yaml", "llm", "agents", "ontology"]
classifiers = [
    # Beta, not Alpha: the file format and the public API have been stable
    # across releases and are covered by the compatibility contract in
    # docs/REFERENCE.md. Not Production/Stable while the version is < 1.0.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/RyutoYoda/trikedb"
Repository = "https://github.com/RyutoYoda/trikedb"
Documentation = "https://github.com/RyutoYoda/trikedb/blob/main/docs/REFERENCE.md"
Changelog = "https://github.com/RyutoYoda/trikedb/blob/main/CHANGELOG.md"
Issues = "https://github.com/RyutoYoda/trikedb/issues"
Demos = "https://ryutoyoda.github.io/trikedb/"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
remote = ["fsspec>=2024.2", "s3fs>=2025.3", "botocore>=1.41.5"]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0"]
shacl = ["pyshacl>=0.25"]
owl = ["owlrl>=6.0.2"]
semantic = ["model2vec>=0.3", "numpy>=1.24"]
networkx = ["networkx>=3"]
# Kept as an extra name for anyone pinning it explicitly; pyoxigraph is a
# core dependency, so this installs nothing new.
oxigraph = ["pyoxigraph>=0.4"]
serve = ["mcp>=1.30,<2", "uvicorn>=0.27", "starlette>=0.37"]
oauth = ["mcp>=1.30,<2", "pyjwt[crypto]>=2.8"]
all = [
    "mcp>=1.30,<2", "uvicorn>=0.27", "starlette>=0.37",
    "fsspec>=2024.2", "s3fs>=2025.3", "botocore>=1.41.5",
    "pyshacl>=0.25", "owlrl>=6.0.2",
    "model2vec>=0.3", "numpy>=1.24", "networkx>=3",
    "pyjwt[crypto]>=2.8", "snowflake-connector-python>=3.0",
    "google-cloud-bigquery>=3.0",
    "pyoxigraph>=0.4",
]
# pyoxigraph is core: it makes read queries 7-47x faster (measured on 8k
# triples, by query shape) at every graph size
# measured, has no dependencies of its own, and ships wheels for every
# mainstream platform. rdflib stays too — owlrl and pyshacl take rdflib
# graphs, and updates diff through one. If pyoxigraph is ever missing (a
# vendored subset, an interpreter it has no wheel for yet), reads fall back
# to rdflib on their own.
# The Snowflake connector is deliberately absent: the storage tests drive the
# SQL layer through a fake DB-API connection, so nothing here needs a
# warehouse to be installed. Real-warehouse checks are run by hand.
dev = [
    "pytest>=7", "mcp>=1.30,<2", "fsspec>=2024.2", "pyshacl>=0.25",
    "owlrl>=6.0.2", "uvicorn>=0.27", "starlette>=0.37", "httpx>=0.27",
    "model2vec>=0.3", "numpy>=1.24", "networkx>=3", "pyjwt[crypto]>=2.8",
    "pyoxigraph>=0.4",
]

[project.scripts]
trikedb = "trikedb.cli:main"
# the short one is what anyone types twice; trikedb stays for scripts that
# already spell it out
trike = "trikedb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The modules are annotated throughout; without this marker file PEP 561 says
# a type checker must ignore all of it, so anyone importing trikedb sees Any.
[tool.setuptools.package-data]
trikedb = ["py.typed"]

[tool.pytest.ini_options]
# Name the suites explicitly: a bare `pytest` at the repo root otherwise
# collects whatever scratch directories happen to be lying around
# untracked (output/, tmp/), and their stale copies of these tests fail
# for reasons that have nothing to do with the code being changed.
testpaths = ["tests", "benchmarks"]
# Keep direct `pytest` and `python -m pytest` invocation behavior identical.
# The regression suite imports helpers from the checkout's benchmarks package.
pythonpath = ["."]
