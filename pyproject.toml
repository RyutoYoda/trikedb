[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trikedb"
version = "0.8.3"
description = "The single-file graph database: a knowledge graph that lives in one YAML file, queried with full SPARQL 1.1. Built for LLM agents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ryuto Yoda" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "rdflib>=7"]
keywords = ["knowledge-graph", "rdf", "triple-store", "yaml", "llm", "agents", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/RyutoYoda/trikedb"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=7", "mcp>=1.2,<2"]

[project.scripts]
trikedb = "trikedb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
