definition_version: 1
streamlit:
  name: graph_curation
  database: DEMO_DB
  schema: KG
  query_warehouse: COMPUTE_WH
  main_file: streamlit_app.py
  title: "Graph curation"
  comment: "Propose facts into a trikedb knowledge graph; each proposal leaves as a pull request"
  # Every entry here is a wildcard, and that is deliberate. Listing files
  # one by one looks tidier and fails silently: add a module and forget to
  # add its line, and the deploy **succeeds** with a file missing. The app
  # then raises ImportError halfway through a write, or -- worse, for data
  # -- simply shows one graph fewer with no error anywhere.
  #
  # The top level used to be a list of two names, on the reasoning that it
  # never changes. Adding i18n.py is what proved otherwise, so it is a
  # wildcard now too.
  #
  #   outbox/       one forgotten adapter = a PR that dies mid-flight
  #   vendor/       trikedb is not in Snowflake's Anaconda channel, so a
  #                 copy of the package is staged next to the app and put
  #                 on sys.path by graph_store._VENDOR. Its module list
  #                 changes between releases.
  #   kg/           the YAML checkout, read when the table cannot be. The
  #                 directory name is not free: graph_store.open_snowflake
  #                 and streamlit_app.open_graph both look for
  #                 kg/workspace.yaml. Stage it somewhere else and the app
  #                 starts with no graph at all rather than complaining.
  additional_source_files:
    - "*.py"
    - outbox/*.py
    - outbox/adapters/*.py
    - vendor/trikedb/*.py
    - kg/*.yaml
