# trike goods — incidents
#
# What went wrong, to which object, and who closed it. An incident is not a
# ticket sitting in a separate tool here: it points at the same
# `inventory-service` node the org graph says commerce-platform operates, and
# the orders it stalled are the same `ORD-25131` nodes the commerce graph
# says a customer placed.
#
# The lifecycle open -> resolved is two dated actions on the incident, so
# `state('INC-2025-03')` is an answer rather than a field. AFFECTED and
# DISRUPTED carry no date, because they say what the incident is *about* —
# which is not something that happened at a time.
#
# The mitigation in between is its own object. It is a thing somebody did,
# with an operator and a time of its own, so MIT-0001 points *at* the
# incident rather than hanging off it. `history('INC-2025-01')` still reads
# it — history folds both directions — while `state('INC-2025-01')` stays
# the incident's own, which is what keeps 'applied' off the incident and off
# the engineer who ran it.

ontology:
  predicates:
    RAISED_BY: {description: incident -> person who opened it, domain: incident, range: person}
    AFFECTED: {description: incident -> system it is about, domain: incident, range: system}
    HELD_UP_BY: {description: order -> incident that stalled it, domain: order, range: incident, requires: PLACED_BY}
    MITIGATED: {description: mitigation -> the incident it stopped, domain: mitigation, range: incident, requires: RAISED_BY, by: person}
    RESOLVED_BY: {description: incident -> person who closed it, domain: incident, range: person, requires: RAISED_BY}
    DISRUPTED: {description: incident -> warehouse it degraded, domain: incident, range: warehouse}

nodes:
  # the incidents themselves
  INC-2025-01: {type: incident, severity: sev2, summary: checkout 5xx spike during the spring sale}
  INC-2025-02: {type: incident, severity: sev3, summary: inventory counts drifted after a partial restock feed}
  INC-2025-03: {type: incident, severity: sev1, summary: order-router dropped Harbour District dispatches}
  INC-2025-04: {type: incident, severity: sev3, summary: pricing-engine applied a stale FX rate}
  INC-2025-05: {type: incident, severity: sev2, summary: wms-core pick lists printed out of order}
  INC-2025-06: {type: incident, severity: sev3, summary: returns-portal uploads timed out over 5MB}
  INC-2025-07: {type: incident, severity: sev2, summary: search-index missed newly listed products for 9 hours}
  INC-2025-08: {type: incident, severity: sev3, summary: duplicate confirmation emails on retried payments}
  INC-2025-09: {type: incident, severity: sev1, summary: Riverside DC conveyor halt stopped outbound scans}
  INC-2025-10: {type: incident, severity: sev2, summary: checkout-api rate limit tripped by a crawler}
  INC-2025-11: {type: incident, severity: sev3, summary: inventory-service leaked connections under retry storms}
  INC-2025-12: {type: incident, severity: sev2, summary: Northfield Freight label API changed without notice}
  # what somebody actually did about them. A mitigation is an object, not
  # a note on the incident: it has an id, the action it performed, the
  # incident it stopped and the person who ran it
  MIT-0001: {type: mitigation, action: rolled the checkout deploy back one revision, applied: "2025-01-21"}
  MIT-0002: {type: mitigation, action: paused the partial restock feed and replayed it whole, applied: "2025-02-12"}
  MIT-0003: {type: mitigation, action: failed Harbour District dispatches over to Northfield DC, applied: "2025-03-03"}
  MIT-0004: {type: mitigation, action: pinned the FX rate to the previous close, applied: "2025-03-22"}
  MIT-0005: {type: mitigation, action: reprinted the wave in pick-path order, applied: "2025-04-13"}
  MIT-0006: {type: mitigation, action: raised the upload limit to 25MB, applied: "2025-05-04"}
  # people, systems, warehouses and orders — every one of these names also
  # exists in another member graph, so an incident is not a silo: it is
  # attached to the same object the rest of the company is talking about
  Ada Marlowe: {type: person, team: commerce-platform}
  Nils Brandt: {type: person, team: fulfilment-ops}
  Rune Halvorsen: {type: person, team: catalog-merch}
  Petra Oyelaran: {type: person, team: customer-care}
