    o: Kofi Mensah
    at: 2025-09-05
    state: open
    severity: sev2

  # what it was about
  - {s: INC-2025-01, p: AFFECTED, o: checkout-api, blast_radius: checkout}
  - {s: INC-2025-02, p: AFFECTED, o: inventory-service, blast_radius: stock}
  - {s: INC-2025-03, p: AFFECTED, o: order-router, blast_radius: dispatch}
  - {s: INC-2025-04, p: AFFECTED, o: pricing-engine, blast_radius: price}
  - {s: INC-2025-05, p: AFFECTED, o: wms-core, blast_radius: picking}
  - {s: INC-2025-06, p: AFFECTED, o: returns-portal, blast_radius: returns}
  - {s: INC-2025-01, p: DISRUPTED, o: Riverside DC, shifts_lost: 1}
  - {s: INC-2025-06, p: DISRUPTED, o: Northfield DC, shifts_lost: 2}
  - {s: INC-2025-11, p: DISRUPTED, o: Harbour Micro-Hub, shifts_lost: 3}
  - {s: INC-2025-04, p: DISRUPTED, o: Old Quarter Returns, shifts_lost: 1}

  # the orders it stalled — the event hangs off the order, because the
  # order is what stopped moving
  - s: ORD-25184
    p: HELD_UP_BY
    o: INC-2025-01
    at: 2025-07-08
    state: held
    hours: 4
  - s: ORD-25183
    p: HELD_UP_BY
    o: INC-2025-02
    at: 2025-07-05
    state: held
    hours: 6
  - s: ORD-25182
