  Riverside DC: {type: warehouse, region: Riverside}
  Northfield DC: {type: warehouse, region: Northfield}
  Harbour Micro-Hub: {type: warehouse, region: Harbour District}
  Old Quarter Returns: {type: warehouse, region: Old Quarter}
  ORD-25180: {type: order, placed: "2025-07-22"}
  ORD-25181: {type: order, placed: "2025-07-25"}
  ORD-25182: {type: order, placed: "2025-07-01"}
  ORD-25183: {type: order, placed: "2025-07-04"}
  ORD-25184: {type: order, placed: "2025-07-07"}

