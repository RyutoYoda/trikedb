  Mira Lindqvist: {type: person, team: commerce-platform}
  Osei Duah: {type: person, team: fulfilment-ops}
  Freya Nakagawa: {type: person, team: catalog-merch}
  Dario Bellini: {type: person, team: customer-care}
  Nadia Sorensen: {type: person, team: data-platform}
  Emil Vasquez: {type: person, team: commerce-platform}
  checkout-api: {type: system, language: python, owner: commerce-platform}
  inventory-service: {type: system, language: go, owner: commerce-platform}
  order-router: {type: system, language: go, owner: fulfilment-ops}
  pricing-engine: {type: system, language: python, owner: catalog-merch}
  wms-core: {type: system, language: java, owner: fulfilment-ops}
  returns-portal: {type: system, language: typescript, owner: customer-care}
