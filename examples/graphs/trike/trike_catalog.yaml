  # price changes and retirements. These used to be a sentence dangling off
  # the product. A price change has a before, an after, a reason and
  # somebody who signed it off — that is an object, so it gets an id, its
  # own properties, and links to the product it moved and the person who
  # approved it. Ask the graph state('PC-0007') and it answers 'applied'.
  PC-0001: {type: price-change, price_before: 8400, price_after: 7560, reason: supplier raised the unit cost}
  PC-0002: {type: price-change, price_before: 11800, price_after: 12740, reason: clearing the last of the spring run}
