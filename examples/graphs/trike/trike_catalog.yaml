  PC-0009: {type: price-change, price_before: 600, price_after: 640, reason: volume discount renegotiated}
  PC-0010: {type: price-change, price_before: 1700, price_after: 1530, reason: end-of-season markdown}
  PC-0011: {type: price-change, price_before: 4300, price_after: 4640, reason: corrected a mis-keyed launch price}
  PC-0012: {type: price-change, price_before: 1800, price_after: 1940, reason: cost base moved with the new supply contract}
  RET-0001: {type: retirement, reason: supplier stopped the line}
  RET-0002: {type: retirement, reason: margin below the category floor}
  RET-0003: {type: retirement, reason: replaced by a cheaper equivalent}
  RET-0004: {type: retirement, reason: "moved to the supplier's own direct channel"}
