# Example: the data platform of Acme Corp (a fictional company).
#
# This is the use case trikedb was designed for: a curated map of
# "which SaaS feeds which ingestion job feeds which warehouse table",
# including change events, deprecations and migrations — so that an
# LLM agent can Read this one file and reason about the pipeline
# without hallucinating table names.

# A predicate can be a description, which is a comment nobody checks, or a
# declared shape, which is enforced: write one of these edges between the
# wrong node types and it is refused, not stored. `domain` is the type
# allowed as the subject, `range` the type allowed as the object.
ontology:
  predicates:
    PROVIDES: {description: "SaaS vendor -> ingestion job", domain: saas, range: job}
    INGESTS_TO: {description: "ingestion job -> warehouse table", domain: job, range: table}
    # the object of a change event is prose, so only the subject has a type
    AFFECTED_BY: {description: "warehouse table -> change event", domain: table}
    # an action on a job, not a table — a declared shape keeps the two apart
    RESTARTED: {description: "ingestion job -> what an operator did to it", domain: job}
    SUPPLEMENTS: {description: "table -> table it fills gaps for", domain: table, range: table}
    MIGRATED_TO: {description: "deprecated table -> its replacement", domain: table, range: table}
    USES_JOB: {description: "workflow step -> ingestion job", domain: process_step, range: job}
    WRITES_TABLE: {description: "workflow step -> warehouse table", domain: process_step, range: table}
    REVIEWS_TABLE: {description: "workflow step -> warehouse table under review", domain: process_step, range: table}
    USES_PLATFORM: {description: "workflow step -> data platform component", domain: process_step, range: platform}
    IMPLEMENTS_MODEL: {description: "workflow step -> data model", domain: process_step, range: data_model}
    ENFORCES_POLICY: {description: "workflow step -> governance policy", domain: process_step, range: policy}
    SERVES_LAYER: {description: "workflow step -> semantic layer", domain: process_step, range: semantic_layer}

# The same graph can also describe an ordered operational workflow.  These
# steps are deliberately separate from the jobs and tables below: the
# workflow is the human/operator process, while the linked nodes provide its
# technical context.
workflows:
  daily-customer-data-refresh:
    label: Daily customer data refresh
    summary: Ingest CRM records, validate privacy-sensitive fields, and publish the customer table
    tags: [domain:customer-data, cadence:daily]
    workflow_facets:
      - label: Data source
        values: [CRM source]
      - label: Owner
        values: [Data Platform]
    steps:
      - id: extract-customer-records
        label: Extract customer records
        description: Run the CRM sync and land the latest contact records.
        next: [validate-customer-records]
      - id: validate-customer-records
        label: Validate customer records
        description: Check schema, privacy constraints, and the latest CRM change event.
        next: [publish-customer-table, request-data-review]
      - id: request-data-review
        label: Request data review
        description: Route unresolved changes to the data-platform owner for review.
        next: [publish-customer-table]
      - id: publish-customer-table
        label: Publish customer table
        description: Make the validated table available to downstream analytics.
  daily-ad-spend-reconciliation:
    label: Daily ad spend reconciliation
    summary: Collect campaign spend, reconcile the warehouse total, and flag manual backfills
    tags: [domain:marketing-analytics, cadence:daily]
    workflow_facets:
      - label: Data source
        values: [Advertising source]
      - label: Output
        values: [Finance reporting]
    steps:
      - id: collect-ad-spend
        label: Collect ad spend
        description: Run the daily collector and land campaign-level spend.
        next: [reconcile-ad-spend]
      - id: reconcile-ad-spend
        label: Reconcile spend totals
        description: Compare the feed with the warehouse total and check unit conversion.
        next: [publish-ad-spend, review-ad-spend]
      - id: review-ad-spend
        label: Review exception
        description: Investigate a mismatch or manual backfill before publishing.
        next: [publish-ad-spend]
      - id: publish-ad-spend
        label: Publish spend report
        description: Release the reconciled daily spend to reporting consumers.
  incident-response:
    label: Ingestion incident response
    summary: Triage a failed ingestion job, restore service, and record the operator action
    tags: [domain:operations, cadence:on-demand]
    workflow_facets:
      - label: Owner
        values: [On-call]
      - label: Runtime
        values: [Lambda]
    steps:
      - id: detect-ingestion-failure
        label: Detect ingestion failure
        description: Identify a stalled or failed ingestion run from monitoring.
        next: [triage-ingestion-failure]
      - id: triage-ingestion-failure
        label: Triage failure
        description: Check the job cursor, source API, and affected warehouse table.
        next: [restart-ingestion-job]
      - id: restart-ingestion-job
        label: Restart ingestion job
        description: Restart the job and confirm that the next run is progressing.
        next: [record-incident-action]
      - id: record-incident-action
        label: Record incident action
        description: Preserve the operator, timestamp, and resulting state in the graph.

# node properties: type drives color + legend, everything else shows in
# the detail panel and is queryable via SPARQL (?x t:type "table")
nodes:
  salesflow-crm: {type: saas, url: "https://salesflow.example", description: CRM vendor, plan: enterprise}
  adastra-ads: {type: saas, url: "https://adastra.example", description: ad platform}
  pingtrack-web: {type: saas, url: "https://pingtrack.example", description: web analytics}
  crm-sync-job: {type: job, runtime: lambda, owner: data-platform}
  ads-spend-collector: {type: job, runtime: lambda, owner: data-platform}
  web-events-stream: {type: job, runtime: kinesis, owner: data-platform}
  crm-nightly-dump: {type: job, runtime: cron, deprecated: true}
  RAW_CRM_CONTACTS: {type: table, schema: ACME_RAW, description: one row per CRM contact, pii: true}
  RAW_AD_SPEND_DAILY: {type: table, schema: ACME_RAW, description: daily ad spend by campaign}
  RAW_WEB_EVENTS: {type: table, schema: ACME_RAW, description: clickstream events, append-only}
  RAW_AD_SPEND_MANUAL: {type: table, schema: ACME_RAW, description: hand-maintained backfill sheet}
  LEGACY_CONTACTS_DUMP: {type: table, schema: ACME_LEGACY, deprecated: true}
  cloud-data-warehouse: {type: platform, category: cloud DWH, role: analytical warehouse, description: governed cloud data platform}
  elt-transformation-tool: {type: platform, category: ELT tool, role: transformation and testing, description: version-controlled data models}
  bronze-layer: {type: data_layer, architecture: medallion, layer: bronze, description: raw immutable landing data}
  silver-layer: {type: data_layer, architecture: medallion, layer: silver, description: cleaned and conformed data}
  gold-layer: {type: data_layer, architecture: medallion, layer: gold, description: business-ready marts}
  customer-dimension: {type: data_model, modeling: dimensional, kind: dimension, description: conformed customer dimension}
  daily-spend-fact: {type: data_model, modeling: dimensional, kind: fact, description: daily campaign spend fact}
  pii-policy: {type: policy, domain: data-governance, description: customer PII classification and access policy}
  quality-policy: {type: policy, domain: data-governance, description: freshness, uniqueness, and reconciliation rules}
  customer-semantic-layer: {type: semantic_layer, category: BI and semantic layer, description: governed metrics for customer and spend analytics}

triples:
  # The workflow's ordered steps are ordinary graph nodes. These context
  # edges let the workbench show the technical jobs and tables beside the
  # process without treating them as additional workflow stages.
  - {s: extract-customer-records, p: USES_JOB, o: crm-sync-job}
  - {s: extract-customer-records, p: WRITES_TABLE, o: RAW_CRM_CONTACTS}
  - {s: validate-customer-records, p: REVIEWS_TABLE, o: RAW_CRM_CONTACTS}
  - {s: publish-customer-table, p: WRITES_TABLE, o: RAW_CRM_CONTACTS}
  - {s: collect-ad-spend, p: USES_JOB, o: ads-spend-collector}
  - {s: collect-ad-spend, p: WRITES_TABLE, o: RAW_AD_SPEND_DAILY}
  - {s: reconcile-ad-spend, p: REVIEWS_TABLE, o: RAW_AD_SPEND_DAILY}
  - {s: review-ad-spend, p: REVIEWS_TABLE, o: RAW_AD_SPEND_MANUAL}
  - {s: publish-ad-spend, p: WRITES_TABLE, o: RAW_AD_SPEND_DAILY}
  - {s: triage-ingestion-failure, p: USES_JOB, o: crm-sync-job}
  - {s: triage-ingestion-failure, p: REVIEWS_TABLE, o: RAW_CRM_CONTACTS}
  - {s: restart-ingestion-job, p: USES_JOB, o: crm-sync-job}
  # Data-engineering components used by the workflows. These are context
  # nodes, not extra ordered stages, so the workflow view can show both the
  # process and the architecture it runs on.
  - {s: extract-customer-records, p: USES_PLATFORM, o: cloud-data-warehouse}
  - {s: extract-customer-records, p: SERVES_LAYER, o: bronze-layer}
  - {s: validate-customer-records, p: USES_PLATFORM, o: elt-transformation-tool}
  - {s: validate-customer-records, p: ENFORCES_POLICY, o: pii-policy}
  - {s: validate-customer-records, p: SERVES_LAYER, o: silver-layer}
  - {s: publish-customer-table, p: IMPLEMENTS_MODEL, o: customer-dimension}
  - {s: publish-customer-table, p: SERVES_LAYER, o: gold-layer}
  - {s: publish-customer-table, p: SERVES_LAYER, o: customer-semantic-layer}
  - {s: collect-ad-spend, p: USES_PLATFORM, o: cloud-data-warehouse}
  - {s: collect-ad-spend, p: SERVES_LAYER, o: bronze-layer}
  - {s: reconcile-ad-spend, p: USES_PLATFORM, o: elt-transformation-tool}
  - {s: reconcile-ad-spend, p: ENFORCES_POLICY, o: quality-policy}
  - {s: publish-ad-spend, p: IMPLEMENTS_MODEL, o: daily-spend-fact}
  - {s: publish-ad-spend, p: SERVES_LAYER, o: gold-layer}
  - {s: publish-ad-spend, p: SERVES_LAYER, o: customer-semantic-layer}
  - {s: triage-ingestion-failure, p: USES_PLATFORM, o: cloud-data-warehouse}
  - {s: triage-ingestion-failure, p: ENFORCES_POLICY, o: quality-policy}

  # vendors -> ingestion jobs
  - {s: salesflow-crm, p: PROVIDES, o: crm-sync-job}
  - {s: adastra-ads, p: PROVIDES, o: ads-spend-collector}
  - {s: pingtrack-web, p: PROVIDES, o: web-events-stream}
  - {s: salesflow-crm, p: PROVIDES, o: crm-nightly-dump, deprecated: true}

  # ingestion jobs -> warehouse tables
  - s: crm-sync-job
    p: INGESTS_TO
    o: RAW_CRM_CONTACTS
    schedule: hourly
    via: https://api.salesflow.example/v2/contacts
  - s: ads-spend-collector
    p: INGESTS_TO
    o: RAW_AD_SPEND_DAILY
    schedule: "daily 06:00 UTC"
    via: https://api.adastra.example/v3/spend
  - {s: web-events-stream, p: INGESTS_TO, o: RAW_WEB_EVENTS, schedule: streaming}
  - {s: crm-nightly-dump, p: INGESTS_TO, o: LEGACY_CONTACTS_DUMP, deprecated: true}

  # change events — the action layer. Every event hangs off the node whose
  # state it changed, and carries when it happened, who did it and what
  # state it left that node in. So "what is RAW_AD_SPEND_MANUAL's state
  # right now" is a question the graph answers, not a string you re-read.
  - s: RAW_AD_SPEND_DAILY
    p: AFFECTED_BY
    o: adastra API v3 — spend now reported in micros (was cents)
    at: 2025-04-01
    by: adastra-ads
    state: applied
  - s: RAW_CRM_CONTACTS
    p: AFFECTED_BY
    o: email column dropped for privacy compliance
    at: 2025-06-15
    by: data-platform
    state: applied
  - s: RAW_AD_SPEND_MANUAL
    p: AFFECTED_BY
    o: backfill sheet superseded by the adastra v3 feed
    at: 2025-07-02
    by: data-platform
    state: pending-review
  # a second event on a table that already had one: the node keeps both and
  # wears the newer one's state, so the history is readable and the answer
  # to "where does this stand" is still one value
  - s: RAW_AD_SPEND_DAILY
    p: AFFECTED_BY
    o: micros conversion applied to the 2024 backfill as well
    at: 2025-08-11
    by: data-platform
    state: applied
  - s: RAW_CRM_CONTACTS
    p: AFFECTED_BY
    o: salesflow v2 renamed company_id to account_id
    at: 2025-08-28
    by: salesflow-crm
    state: pending-review
  - s: crm-sync-job
    p: RESTARTED
    o: hourly run wedged on a v2 pagination cursor
    at: 2025-09-02T09:14:00+09:00
    by: on-call
    state: running
  - s: RAW_WEB_EVENTS
    p: AFFECTED_BY
    o: session_id backfill reverted — it double-counted returning visitors
    at: 2025-09-05
    by: data-platform
    state: rolled-back

  # deprecations and gap-filling. The migration is an action that happened
  # between two objects, so it is dated like one: the line between the old
  # table and its replacement is where you read when it happened and what
  # it left behind — not a note filed somewhere off to the side.
  - s: LEGACY_CONTACTS_DUMP
    p: MIGRATED_TO
    o: RAW_CRM_CONTACTS
    at: 2025-05-20
    by: data-platform
    state: migrated
    deprecated: true
  - s: RAW_AD_SPEND_MANUAL
    p: SUPPLEMENTS
    o: RAW_AD_SPEND_DAILY
    note: manual backfill covering spend before 2024
