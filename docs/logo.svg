<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- trikedb mascot: a triceratops whose three horns are the triple (s, p, o) -->

  <!-- tail -->
  <path d="M 400 330 Q 480 300 496 250 Q 470 300 420 300 Z" fill="#3d5a80"/>

  <!-- back legs -->
  <rect x="350" y="360" width="44" height="80" rx="20" fill="#2b3a55"/>
  <rect x="270" y="375" width="44" height="80" rx="20" fill="#3d5a80"/>

  <!-- body -->
  <ellipse cx="290" cy="310" rx="150" ry="105" fill="#4a6fa5"/>

  <!-- front legs -->
  <rect x="200" y="370" width="42" height="82" rx="20" fill="#3d5a80"/>
  <rect x="150" y="360" width="42" height="80" rx="20" fill="#2b3a55"/>

  <!-- frill -->
  <circle cx="170" cy="210" r="105" fill="#2b3a55"/>
  <circle cx="170" cy="210" r="82" fill="#3d5a80"/>

  <!-- head -->
  <circle cx="120" cy="245" r="72" fill="#4a6fa5"/>

  <!-- beak / snout -->
  <path d="M 55 235 Q 30 250 38 272 Q 55 290 85 285 Q 65 265 68 240 Z" fill="#3d5a80"/>

  <!-- cheeks -->
  <circle cx="95" cy="285" r="14" fill="#5a83b8" opacity="0.6"/>

  <!-- eye -->
  <circle cx="105" cy="235" r="16" fill="#ffffff"/>
  <circle cx="101" cy="238" r="8" fill="#1a1c22"/>
  <circle cx="98" cy="234" r="3" fill="#ffffff"/>

  <!-- smile -->
  <path d="M 62 268 Q 75 278 90 272" stroke="#1a1c22" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- horn 1: subject (blue) — nose horn -->
  <path d="M 72 218 L 58 160 L 92 208 Z" fill="#4f8ef7"/>
  <text x="46" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#4f8ef7">s</text>

  <!-- horn 2: predicate (orange) — first brow horn -->
  <path d="M 122 178 L 122 100 L 152 172 Z" fill="#f7784f"/>
  <text x="126" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#f7784f">p</text>

  <!-- horn 3: object (green) — second brow horn -->
  <path d="M 172 190 L 200 122 L 208 198 Z" fill="#2fbf71"/>
  <text x="204" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="bold" fill="#2fbf71">o</text>

  <!-- wordmark -->
  <text x="256" y="492" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#3d5a80">trikedb</text>
</svg>
